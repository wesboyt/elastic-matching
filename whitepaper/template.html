<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Housing Shortage Tax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: a single reading column like a working paper, with key numbers
     pulled into a ledger strip and every figure set on a white plate. */
  --paper: #f7f8f6;
  --ink: #161a21;
  --muted: #5b6270;
  --rule: #dfe2dc;
  --accent: #1f5fbf;
  --loss: #b8412f;
  --plate: #ffffff;
  --font-display: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12151a; --ink: #e9ebee; --muted: #a2a9b5; --rule: #2a2f37;
    --accent: #6ea2ef; --loss: #ec8a76; --plate: #fcfcfb; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12151a; --ink: #e9ebee; --muted: #a2a9b5; --rule: #2a2f37;
  --accent: #6ea2ef; --loss: #ec8a76; --plate: #fcfcfb; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 18px; line-height: 1.6;
}
main { max-width: 760px; margin: 0 auto; padding: 48px 20px 96px; }
header.paper-head { border-bottom: 2px solid var(--ink); padding-bottom: 24px; margin-bottom: 32px; }
.kicker { font-family: var(--font-display); font-size: 13px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(32px, 6vw, 46px);
  line-height: 1.1; margin: 0 0 16px; text-wrap: balance; }
.dek { font-size: 21px; line-height: 1.45; color: var(--muted); margin: 0 0 16px; text-wrap: pretty; }
.meta { font-family: var(--font-display); font-size: 13px; color: var(--muted); margin: 0; }
h2 { font-family: var(--font-display); font-size: 25px; line-height: 1.25; margin: 56px 0 12px;
  text-wrap: balance; display: flex; gap: 12px; align-items: baseline; }
h2 .num { color: var(--accent); font-size: 15px; font-weight: 600; min-width: 22px; }
h3 { font-family: var(--font-display); font-size: 18px; margin: 32px 0 8px; }
p { margin: 0 0 16px; }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
strong { font-weight: 600; }
.ledger { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 0;
  border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); margin: 8px 0 32px; }
.ledger div { padding: 16px; display: flex; flex-direction: column; gap: 4px;
  border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.ledger .v { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.1;
  font-variant-numeric: tabular-nums; }
.ledger .v.loss { color: var(--loss); }
.ledger .l { font-family: var(--font-display); font-size: 13px; line-height: 1.35; color: var(--muted); }
figure { margin: 24px 0 32px; }
figure .plate { background: var(--plate); border: 1px solid var(--rule); border-radius: 4px; padding: 8px;
  overflow-x: auto; }
figure img { display: block; width: 100%; max-width: 100%; height: auto; min-width: 560px; }
figcaption { font-family: var(--font-display); font-size: 14px; line-height: 1.45; color: var(--muted);
  margin-top: 8px; }
figcaption b { color: var(--ink); font-weight: 600; }
.table-wrap { overflow-x: auto; margin: 16px 0 24px; }
table { border-collapse: collapse; width: 100%; font-family: var(--font-display); font-size: 14.5px;
  font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 13px; }
td.r, th.r { text-align: right; }
.status { display: inline-block; font-family: var(--font-display); font-size: 12px; font-weight: 600;
  padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.s-strong { color: #2f7d4f; } .s-mixed { color: #a26a00; } .s-open { color: var(--loss); }
:root[data-theme="dark"] .s-strong { color: #6fcf97; }
:root[data-theme="dark"] .s-mixed { color: #e8b44a; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .s-strong { color: #6fcf97; }
  :root:not([data-theme="light"]) .s-mixed { color: #e8b44a; }
}
.callout { border-left: 3px solid var(--accent); padding: 4px 0 4px 16px; margin: 24px 0; }
.callout p:last-child { margin-bottom: 0; }
ol.tight, ul.tight { padding-left: 22px; margin: 0 0 16px; }
ol.tight li, ul.tight li { margin-bottom: 8px; }
.refs { font-size: 15px; line-height: 1.5; color: var(--muted); }
footer { margin-top: 64px; padding-top: 16px; border-top: 1px solid var(--rule);
  font-family: var(--font-display); font-size: 13px; color: var(--muted); }
code { font-size: 15px; }
@media (max-width: 480px) {
  body { font-size: 17px; }
  .ledger .v { font-size: 24px; }
}
</style>
</head>
<body>
<main>
{{CONTENT}}
<footer>The Housing Shortage Tax · working paper, November 2026 · simulations are stylised and their parameters illustrative; empirical estimates rest on the assumptions stated in each section.</footer>
</main>
</body>
</html>
